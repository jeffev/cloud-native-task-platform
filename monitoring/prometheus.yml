global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  # -----------------------------
  # FastAPI Application
  # -----------------------------
  - job_name: "task_api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "api:8000"

  # -----------------------------
  # Prometheus self-monitoring
  # -----------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
